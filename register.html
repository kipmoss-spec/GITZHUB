
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b09">
  <title>Create Account | KLYX HUB</title>
  <link rel="icon" href="favicon.ico">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b09;
      color: #f4f4ed;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .register-container {
      width: 100%;
      max-width: 440px;
      background: #121915;
      border: 1px solid #26352c;
      border-radius: 18px;
      padding: 32px 26px;
      box-shadow: 0 15px 45px rgba(0,0,0,.4);
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .brand h1 {
      font-size: 27px;
      letter-spacing: 2px;
      color: #d4af37;
    }

    .brand h1 span {
      color: #087f45;
    }

    .brand p {
      color: #a2aaa4;
      font-size: 13px;
      margin-top: 7px;
    }

    h2 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #a2aaa4;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #d4af37;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #35443a;
      background: #080b09;
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #d4af37;
    }

    .hint {
      color: #87938a;
      font-size: 12px;
      margin-top: -10px;
      margin-bottom: 17px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #d4af37;
      color: #080b09;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #3a1717;
      color: #ffbaba;
    }

    .message.success {
      display: block;
      background: #123324;
      color: #a8efc5;
    }

    .login {
      text-align: center;
      color: #a2aaa4;
      font-size: 14px;
      margin-top: 24px;
    }

    .login a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      color: #a2aaa4;
      text-decoration: none;
      font-size: 13px;
      margin-top: 24px;
    }

    footer {
      text-align: center;
      color: #68736b;
      font-size: 11px;
      margin-top: 27px;
    }
  </style>
</head>

<body>

  <main class="register-container">

    <div class="brand">
      <img src="klyx-icon.png" alt="KLYX logo">
      <h1>KLYX <span>HUB</span></h1>
      <p>Seamless Experience.</p>
    </div>

    <h2>Create Your Account</h2>
    <p class="subtitle">Join KLYX HUB and enjoy a seamless experience.</p>

    <div id="message" class="message" role="status"></div>

    <form id="register-form">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        autocomplete="name"
        required
        maxlength="80"
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        autocomplete="new-password"
        minlength="8"
        required
      >
      <p class="hint">Use at least 8 characters.</p>

      <label for="confirm-password">Confirm Password</label>
      <input
        type="password"
        id="confirm-password"
        placeholder="Enter your password again"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="register-button">
        Create Account
      </button>

    </form>

    <p class="login">
      Already have an account?
      <a href="login.html">Sign In</a>
    </p>

    <a href="index.html" class="back">← Back to KLYX HUB</a>

    <footer>
      © 2026 KLYX HUB. All rights reserved.
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://kgqojnwfuqqvfkqkswri.supabase.co";

    // Use the same public publishable key as login.html.
    // Never use the sb_secret_ key here.
    const SUPABASE_KEY = "sb_publishable_AslZ3DDcQqjNlY7AFyJKPg_sX6f8DQt"

    const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

    const form = document.getElementById("register-form");
    const button = document.getElementById("register-button");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirm-password").value;

      if (!name) {
        showMessage("Please enter your full name.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";
      message.className = "message";

      try {
        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              display_name: name
            },
            emailRedirectTo:
              "https://kipmoss-spec.github.io/klyx-hub/login.html"
          }
        });

        if (error) throw error;

        showMessage(
          "Registration submitted! Please check your email and confirm your address before signing in.",
          "success"
        );

        form.reset();

      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>

</body>
  </html>
