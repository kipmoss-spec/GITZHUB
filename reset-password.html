
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b09">
  <title>Reset Password | KLYX HUB</title>
  <link rel="icon" href="favicon.ico">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b09;
      color: #f4f4ed;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #121915;
      border: 1px solid #26352c;
      border-radius: 18px;
      padding: 32px 26px;
      box-shadow: 0 15px 45px rgba(0,0,0,.4);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .brand h1 {
      font-size: 27px;
      letter-spacing: 2px;
      color: #d4af37;
    }

    .brand h1 span {
      color: #087f45;
    }

    .brand p {
      color: #a2aaa4;
      font-size: 13px;
      margin-top: 7px;
    }

    h2 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #a2aaa4;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #d4af37;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #35443a;
      background: #080b09;
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 19px;
    }

    input:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #d4af37;
      color: #080b09;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #3a1717;
      color: #ffbaba;
    }

    .message.success {
      display: block;
      background: #123324;
      color: #a8efc5;
    }

    .back {
      display: block;
      text-align: center;
      color: #d4af37;
      text-decoration: none;
      font-size: 14px;
      margin-top: 24px;
    }

    footer {
      text-align: center;
      color: #68736b;
      font-size: 11px;
      margin-top: 28px;
    }

    #reset-form {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      <img src="klyx-icon.png" alt="KLYX logo">
      <h1>KLYX <span>HUB</span></h1>
      <p>Seamless Experience.</p>
    </div>

    <h2 id="page-title">Reset Your Password</h2>

    <p class="subtitle" id="page-subtitle">
      Enter your new password below to regain access to your account.
    </p>

    <div id="message" class="message" role="status"></div>

    <form id="reset-form">

      <label for="password">New Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirm-password">Confirm New Password</label>
      <input
        type="password"
        id="confirm-password"
        placeholder="Enter password again"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="reset-button">
        Update Password
      </button>

    </form>

    <a href="login.html" class="back">← Back to Login</a>

    <footer>
      © 2026 KLYX HUB. All rights reserved.
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://kgqojnwfuqqvfkqkswri.supabase.co";

    // Use the same publishable key as login.html.
    // Never use your sb_secret_ key here.
    const SUPABASE_KEY = sb_publishable_AslZ3DDcQqjNlY7AFyJKPg_sX6f8DQt

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("reset-form");
    const button = document.getElementById("reset-button");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    let recoverySessionReady = false;

    async function initializeRecovery() {
      try {
        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (data.session) {
          recoverySessionReady = true;
          form.style.display = "block";
          return;
        }

        showMessage(
          "Open this page using the password recovery link sent to your email.",
          "error"
        );

      } catch (error) {
        showMessage(error.message, "error");
      }
    }

    client.auth.onAuthStateChange(function(event, session) {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoverySessionReady = true;
        form.style.display = "block";
        showMessage(
          "Recovery link verified. You can now choose a new password.",
          "success"
        );
      }
    });

    initializeRecovery();

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!recoverySessionReady) {
        showMessage(
          "Your recovery session is not ready. Please open a fresh recovery email link.",
          "error"
        );
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirm-password").value;

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Updating password...";

      try {
        const { error } = await client.auth.updateUser({
          password: password
        });

        if (error) throw error;

        await client.auth.signOut();

        form.reset();
        form.style.display = "none";

        showMessage(
          "Your password has been updated successfully. You can now sign in using your new password.",
          "success"
        );

        document.getElementById("page-title").textContent =
          "Password Updated";

        document.getElementById("page-subtitle").textContent =
          "Your account is ready. Return to login to continue.";

      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });
  </script>

</body>
</html>
